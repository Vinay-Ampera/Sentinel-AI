# Local DEVELOPMENT services only. Not production (see docker-compose.prod.yml, Stage 16).
# Secrets come from the environment / an untracked root .env (see .env.example); there are
# no defaults for passwords, so `docker compose` refuses to start without them.
#
#   docker compose up -d redis                       # Redis only (default)
#   docker compose --profile local-db up -d          # Redis + a *separate* dev PostgreSQL
#
# Your existing local PostgreSQL database "sentinel-ai" is NOT managed here. The optional
# `postgres` service is for a throw-away dev/test database on its own port and volume.
name: sentinel-ai-dev

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

  postgres:
    profiles: ["local-db"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}  # blank => the image refuses to start (safe); set it in .env
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_ai_dev}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - sentinel_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sentinel_dev_pgdata:
