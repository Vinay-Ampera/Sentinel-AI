[tool.poetry]
name = "sentinel-ai-backend"
version = "0.1.0"
description = "Sentinel AI platform backend (FastAPI)"
authors = []
readme = "README.md"
packages = [{ include = "sentinel_ai", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = ">=0.115"
uvicorn = ">=0.30"
alembic = ">=1.13"
sqlalchemy = ">=2.0"
psycopg = {version = ">=3.2", extras = ["binary"]}
pydantic-settings = ">=2.7"
redis = ">=5"
argon2-cffi = "^25.1.0"
celery = {version = ">=5.4", extras = ["redis"]}
kombu = ">=5.6,<5.7"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
httpx = ">=0.27"
ruff = ">=0.6"
mypy = ">=1.11"
bandit = "^1.9.4"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["sentinel_ai"]

[[tool.mypy.overrides]]
# Celery ships no type information.
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Long SQL string literals in migrations and DB tests are clearer unwrapped.
"migrations/**" = ["E501"]
"tests/integration/**" = ["E501"]
"tests/unit/test_sandbox.py" = ["E501"]
"tests/unit/test_pytest_runner.py" = ["E501"]
"tests/unit/test_bandit_scanner.py" = ["E501"]
"tests/unit/test_security_scanners.py" = ["E501"]
# Dense detection tables and one-line gap definitions read better unwrapped.
"src/sentinel_ai/services/analyzer.py" = ["E501"]
"src/sentinel_ai/services/check_catalog.py" = ["E501"]
"src/sentinel_ai/services/authorizations.py" = ["E501"]
"src/sentinel_ai/services/plans.py" = ["E501"]
"src/sentinel_ai/services/approvals.py" = ["E501"]
"src/sentinel_ai/services/runs.py" = ["E501"]
"src/sentinel_ai/services/findings.py" = ["E501"]
"src/sentinel_ai/api/findings.py" = ["E501"]
"src/sentinel_ai/repositories/findings.py" = ["E501"]
"src/sentinel_ai/execution/evidence.py" = ["E501"]
"src/sentinel_ai/execution/docker_executor.py" = ["E501"]
"src/sentinel_ai/execution/docker_runner.py" = ["E501"]
"src/sentinel_ai/execution/sandbox_spec.py" = ["E501"]
"src/sentinel_ai/services/job_state.py" = ["E501"]
"src/sentinel_ai/services/worker_runtime.py" = ["E501"]
"src/sentinel_ai/services/reconciler.py" = ["E501"]
"src/sentinel_ai/repositories/runs.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency declarations in signatures are idiomatic, not mutable defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
