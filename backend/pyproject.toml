[tool.poetry]
name = "sentinel-ai-backend"
version = "0.1.0"
description = "Sentinel AI platform backend (FastAPI)"
authors = []
readme = "README.md"
packages = [{ include = "sentinel_ai", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = ">=0.115"
uvicorn = ">=0.30"
alembic = ">=1.13"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
httpx = ">=0.27"
ruff = ">=0.6"
mypy = ">=1.11"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["sentinel_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
